name: tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  CARGO_TERM_COLOR: always

# Both amd64 and native arm64 (free `ubuntu-24.04-arm` runners on
# public repos since 2025-04). Catches arch-specific bugs BEFORE
# publish.yml ships an arm64 container image. See STANDARDS.md §6.
jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # Namespace by arch — amd64 and arm64 target/ can't share.
          key: cargo-${{ matrix.runner }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ matrix.runner }}-
      - name: fmt check
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: build
        run: cargo build --release --bin xtr-on-rust
      - name: cargo test
        run: cargo test --release --no-fail-fast

  docs-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install mdBook
        run: |
          MDBOOK_VERSION=0.4.40
          curl -sSL -o mdbook.tar.gz \
            "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          tar -xzf mdbook.tar.gz -C /usr/local/bin/ mdbook
          rm mdbook.tar.gz
      - name: Install mdbook-linkcheck
        run: |
          MDLC_VERSION=0.7.7
          curl -sSL -o mdbook-linkcheck.zip \
            "https://github.com/Michael-F-Bryan/mdbook-linkcheck/releases/download/v${MDLC_VERSION}/mdbook-linkcheck.x86_64-unknown-linux-gnu.zip"
          unzip -o mdbook-linkcheck.zip -d /usr/local/bin/ mdbook-linkcheck
          chmod +x /usr/local/bin/mdbook-linkcheck
          rm mdbook-linkcheck.zip
      # Match docs.yml: CHANGELOG.md + MIGRATION.md are sources
      # of truth; book renders synced copies under reference/.
      # sed rewrite: repo-root cross-links (./CHANGELOG.md,
      # ./MIGRATION.md) → book-local (./changelog.md,
      # ./migration.md) so linkcheck passes.
      - name: Sync CHANGELOG + MIGRATION into book
        run: |
          sed -e 's|(\./MIGRATION\.md|(./migration.md|g' \
              -e 's|(\./CHANGELOG\.md|(./changelog.md|g' \
              CHANGELOG.md > book/src/reference/changelog.md
          sed -e 's|(\./MIGRATION\.md|(./migration.md|g' \
              -e 's|(\./CHANGELOG\.md|(./changelog.md|g' \
              MIGRATION.md > book/src/reference/migration.md
      - name: Build book (fails on broken internal links)
        run: mdbook build book
