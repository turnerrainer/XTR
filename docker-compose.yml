# Production-hardened compose file for XTR-on-Rust.
# See STANDARDS.md §9 for the security posture rationale.
services:
  xtr-on-rust:
    build:
      context: .
      dockerfile: Dockerfile
    image: xtr-on-rust:0.2.0-rc.1
    container_name: xtr-on-rust
    ports:
      - "8080:8080"
    # volumes:
    #   - ./config:/app/config:ro           # add once XTR domain lands
    #   - ./constants.ini:/app/constants.ini:ro
    environment:
      - RUST_LOG=info
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 512M
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
