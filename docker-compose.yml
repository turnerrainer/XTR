# Production-hardened compose file for XTR-on-Rust.
# See STANDARDS.md §9 for the security posture rationale.
services:
  xtr-on-rust:
    build:
      context: .
      dockerfile: Dockerfile
    image: xtr-on-rust:0.1.0-rc.2
    container_name: xtr-on-rust
    ports:
      - "8080:8080"
    # The image ships xtr.yaml + wsdl/ + DSL/ baked in as the
    # demo. Override any of those with bind mounts:
    #
    # volumes:
    #   - ./xtr.yaml:/app/xtr.yaml:ro
    #   - ./wsdl:/app/wsdl:ro                # your own WSDLs
    #   - ./DSL:/app/DSL:ro                  # hand-written DSLs
    #   - ./ssl:/app/ssl:ro                  # PKCS12 for X-Road SS
    environment:
      - RUST_LOG=info
      # XTR_KEYSTORE_PASSWORD=<from-your-secret-manager>
    restart: unless-stopped
    # Not read-only: WSDL folder-drop (task 013) regenerates
    # DSL/*.yml files under /app/DSL on every boot. Other
    # hardening (cap_drop, no-new-privileges, non-root uid,
    # resource limits) stays in place. To harden further,
    # pre-generate DSLs on host and set `wsdl_watch_dir:` to
    # empty in a mounted xtr.yaml override — then re-enable
    # `read_only: true`.
    tmpfs:
      - /tmp:size=64M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 512M
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
