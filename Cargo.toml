[package]
name = "xtr-on-rust"
version = "0.2.0-rc"
edition = "2021"
rust-version = "1.88"
authors = ["Rainer Türner"]
license = "Apache-2.0"
description = "XTR — Rust implementation. REST proxy for X-Road SOAP services."
repository = "https://github.com/turnerrainer/XTR"

[dependencies]
# Web framework + async runtime
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.4", features = ["util"] }

# Serialisation
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"

# HTTP client (native-tls for PKCS12 identity support required by
# the X-Road Security Server mTLS path — see DESIGN.md §8.6)
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }

# Domain
handlebars = "6"
quick-xml = { version = "0.41", features = ["serialize"] }
uuid = { version = "1", features = ["v4"] }

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities
thiserror = "2"
anyhow = "1"
once_cell = "1"
url = "2"

[dev-dependencies]
tempfile = "3"
# Audit-v1 H4 regression test: generate a self-signed cert in
# memory + spin a local TLS server; assert reqwest (system trust
# store) refuses the handshake. rcgen is the standard pure-Rust
# cert generator; native-tls + tokio-native-tls are already in
# the runtime tree via reqwest — promoted here so the test can
# name them explicitly.
rcgen = "0.13"
native-tls = "0.2"
tokio-native-tls = "0.3"

[[bin]]
name = "xtr-on-rust"
path = "src/main.rs"

# Clippy posture — matches Ruuter-on-Rust and STANDARDS.md §2.
# `cargo clippy --all-targets -- -D warnings` is the CI gate.
[lints.clippy]
